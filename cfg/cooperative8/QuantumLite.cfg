// =======================================================================================
//                                   		General 
// =======================================================================================

sm_cvar rescue_min_dead_time 20            //# People want to play, not wait forever

sv_maxplayers 8

sm_cvar survivor_friendly_fire_factor_expert 0.1

//#Common Incap Damage
sm_cvar z_hit_incap_factor_easy "0.5"
sm_cvar z_hit_incap_factor_normal "1.5"
sm_cvar z_hit_incap_factor_hard "1.5"
sm_cvar z_hit_incap_factor_expert "1.5"

//# [l4dinfectedbots.smx]
sm_cvar l4d_infectedbots_read_data "Quantum"

//# 115 in coop, 170 in versus
sm_cvar l4d2_water_move_speed_normal 170

//# =======================================================================================
//# 									 Weaponry CVARs 
