//# =======================================================================================
//# [ Quantum Lite ] - Spanish
//# =======================================================================================
//#  Una version mas ligera y estable del modo Quantum.
//#  Mantiene la esencia cooperativa caotica de 8 jugadores, pero con menos estres del sistema
//#  y una jugabilidad mas fluida para partidas rapidas o servidores con menos recursos.
//#
//#  - Mismo espiritu de combate masivo, con ajustes para un rendimiento optimo.
//#  - Perfecto para sesiones cooperativas intensas pero mas accesibles.
//#  - Disenado para equilibrar diversion, caos y estabilidad.
//#  - Recomendado para quienes buscan accion continua sin sobrecargar el servidor.
//#
//# =======================================================================================
//# [ Quantum Lite ] - English
//# =======================================================================================
//#  A lighter and more stable version of the Quantum mode.
//#  Keeps the chaotic 8-player cooperative essence, but with lower system stress
//#  and smoother gameplay for quick sessions or low-resource servers.
//#
//#  - Same large-scale combat spirit, tuned for optimal performance.
//#  - Perfect for intense yet more accessible co-op sessions.
//#  - Designed to balance fun, chaos, and stability.
//#  - Recommended for those seeking nonstop action without overloading the server.

