//# =======================================================================================
//# [ Complementaries ]
//# =======================================================================================

exec FF_complementaries.cfg

//# =======================================================================================
//#                                  • [ Plugin Loading ] •
//# =======================================================================================

sm plugins load "disabled/gamemodes/DM/NoInfectedBots.smx"
sm plugins load "disabled/gamemodes/DM/l4d_weapon_spawn.smx"
sm plugins load "disabled/gamemodes/DM/l4d_unscope.smx"
sm plugins load "disabled/gamemodes/DM/l4d_survivor_shove.smx"
sm plugins load "disabled/gamemodes/DM/clear_dead_body.smx"
sm plugins load "disabled/gamemodes/DM/[DM] Shove.smx"
sm plugins load "disabled/gamemodes/DM/[DM] Hud Hp Bar.smx"
sm plugins load "disabled/gamemodes/DM/[DM] RespawnTimer.smx"
sm plugins load "disabled/gamemodes/DM/[DM] Points.smx"

//# HeartBeat
sm plugins load "disabled/gamemodes/DM/heartbeat system/heartbeat system.smx"
sm plugins load "disabled/gamemodes/DM/heartbeat system/dynamic_heartbeat.smx"
sm plugins load "disabled/gamemodes/DM/heartbeat system/HP Regen.smx"
sm plugins load "disabled/gamemodes/DM/heartbeat system/l4d_heartbeat.smx"

//# =======================================================================================
//#                                  [ Config Loading ]
//# =======================================================================================

sm_cvar mp_gamemode "coop"

//# Prevent the game from ending
sm_cvar director_no_death_check 1

//# Survivor settings
sm_cvar survivor_allow_crawling 1            
sm_cvar survivor_crawl_speed 180        
sm_cvar survivor_incap_health 60
sm_cvar survivor_revive_duration 2 
sm_cvar survivor_revive_health 60  
sm_cvar survivor_limp_health 25 
sm_cvar first_aid_heal_percent 1
sm_cvar first_aid_kit_max_heal 100  
sm_cvar first_aid_kit_use_duration 2
sm_cvar pain_pills_health_value 60 
sm_cvar defibrillator_use_duration 2 
sm_cvar survivor_still_penalty 1.0  
sm_cvar sb_all_bot_team 1   
sm_cvar z_gun_horiz_punch 1
sm_cvar sv_rollangle 2.25
sm_cvar z_gun_kick 0
sm_cvar z_common_limit 0
sm_cvar z_friendly_fire_forgiveness 0
sm_cvar z_difficulty "impossible"
sm_cvar pipe_bomb_timer_duration 1.8
