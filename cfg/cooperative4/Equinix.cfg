//# =======================================================================================
//#                                   [ Equinix Balance ] - Spanish
//# =======================================================================================
//# Este modo utiliza las configuraciones originales de Left 4 Dead 2 con algunos cambios
//# Trata de balancear el gameplay en coop, ademas hace el juego mas dificil, pero no tanto.

//# =======================================================================================
//#                                   [ Equinix Balance ] - English
//# =======================================================================================
//# This mode uses the original Left 4 Dead 2 settings with some changes
//# Tries to balance coop gameplay, also makes the game a little hard, but not too much

//# =======================================================================================
//#                                  [ Complementaries ] 
//# =======================================================================================

exec FF_complementaries.cfg

//# =======================================================================================
//# [ Plugin Loading ]
//# =======================================================================================

//# Balance Tweaks in CO-OP
sm plugins load "disabled/optionaltweaks/l4d2_ammostack_rework.smx"
sm plugins load "disabled/optionaltweaks/l4d2_tankonfire.smx"
sm plugins load "disabled/optionaltweaks/l4d2_static_shotgun_spread"
sm plugins load "disabled/optionaltweaks/[Edited] biletheworld.smx"
sm plugins load "disabled/optionaltweaks/[L4D2] CI_DamageMod.smx"
sm plugins load "disabled/optionaltweaks/l4d_revive_health_decay.smx"
sm plugins load "disabled/optionaltweaks/l4d2_horde_director.smx"
sm plugins load "disabled/optionaltweaks/l4d2_horde_director_helper.smx"
sm plugins load "disabled/optionaltweaks/l4d2_finale_fail_ending.smx"

sm plugins load "disabled/optionalfixes/l4d2_refillreload_fix.smx"
sm plugins load "disabled/optionalfixes/l4d_fix_shove_duration.smx"
sm plugins load "disabled/gamemodes/zonemod-hybrid/fix_fastmelee.smx"

//# Undefined Directory
sm plugins load "disabled/[FF] Map Sniper Swap.smx"
sm plugins load "disabled/[FF] Map Melee Removal.smx"

//# Coop Essentials
sm plugins load "disabled/Handlers+Informators/DropWeapon.smx"
sm plugins load "disabled/Handlers+Informators/[FF] Command Utilities.smx"
//sm plugins load "disabled/coopessentials/[HoE] Gear Transfer.smx"
sm plugins load "disabled/coopessentials/[HoE] Item Hint.smx"

//sm plugins load "disabled/gamemodes/8player-abm/[L4D2] Survivor Identity Fix.smx"
//sm plugins load "disabled/gamemodes/8player-abm/[L4D2] Character Manager.smx"
//sm plugins load "disabled/gamemodes/8player-abm/[L4D2] Survivor Identity Fix.smx"
//sm plugins load "disabled/gamemodes/8player-abm/[L4D2] Character Manager.smx"
//sm plugins load "disabled/gamemodes/8player-abm/L4D2_arms.smx"

//# ZcontentPack-1
sm plugins load "disabled/ZContent1/fortnite_emotes_extended (NoDL).smx"

//# =======================================================================================
//# [ General ]
//# =======================================================================================

sv_maxplayers 4

//# Minimal Health to get black and white status when revived.
sm_cvar survivor_revive_bw_health 100.0

// Force 4 shoves only
sm_cvar z_gun_swing_coop_min_penalty 2
sm_cvar z_gun_swing_coop_max_penalty 4

//sm_cvar director_melee_weapon_density 1.0

sm_cvar survivor_revive_health 41

//# =======================================================================================
//# [ Common Infected ]
//# =======================================================================================

//# Yeah no thanks... vanilla expert is bullshit
//# Common infected with damage resistance is a cheap way to make "difficulty" but it isnt...
//# I'd prefer to make expert more casual, and leave the difficulty to HardMode.
sm_cvar z_non_head_damage_factor_expert 0.75

//# Damage If Survivor alive
sm_cvar z_throttle_hit_interval_easy 0.10
sm_cvar z_throttle_hit_interval_normal 0.33
sm_cvar z_throttle_hit_interval_hard 0.33
sm_cvar z_throttle_hit_interval_expert 0.33

//# CI Damage
sm_cvar nb_damage_enable 1
sm_cvar nb_damage_easy 1.0
sm_cvar nb_damage_normal 2.0
sm_cvar nb_damage_hard 5.0
sm_cvar nb_damage_expert 11.0
sm_cvar nb_damage_modifier 0.9

//# Confogl Hordes
sm_cvar z_mega_mob_size 50

sm_cvar z_mob_spawn_min_size 30
sm_cvar z_mob_spawn_max_size 30

sm_cvar z_mob_spawn_min_interval_easy	250
sm_cvar z_mob_spawn_min_interval_normal 250
sm_cvar z_mob_spawn_min_interval_hard 250
sm_cvar z_mob_spawn_min_interval_expert 250

sm_cvar z_mob_spawn_max_interval_easy	 250
sm_cvar z_mob_spawn_max_interval_normal	250
sm_cvar z_mob_spawn_max_interval_hard	 250
sm_cvar z_mob_spawn_max_interval_expert 250

//# =======================================================================================
//# [ Special Infected ]
//# =======================================================================================

sm_cvar z_door_pound_damage 100
sm_cvar z_pounce_door_damage 500

//# General Versus Gamemode File
sm_cvar z_pounce_stumble_radius 160
sm_cvar z_pounce_damage_interrupt 150
sm_cvar z_max_stagger_duration 1.0
sm_cvar versus_shove_hunter_fov 15
sm_cvar versus_shove_hunter_fov_pouncing 15
sm_cvar versus_shove_jockey_fov_leaping 15
sm_cvar tank_burn_duration 90
sm_cvar vomitjar_duration_infected_pz 15
sm_cvar tongue_break_from_damage_amount 300
sm_cvar z_scrimmage_creep_delay 0
sm_cvar z_scrimmage_creep_rate 100

sm_cvar z_jockey_speed 275
sm_cvar z_jockey_health 250
sm_cvar z_jockey_control_variance 0

//# =======================================================================================
//# 									 Weaponry CVARs 
//# =======================================================================================

exec "friendlyfire_weaponbalance/competitive.cfg"
