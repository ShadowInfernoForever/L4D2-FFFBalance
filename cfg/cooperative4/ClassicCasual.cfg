//# =======================================================================================
//# [ FF-Classic ] -- Spanish
//# =======================================================================================
//# Configuración básica sin modificaciones extremas. Vanilla común y corriente.
//# Preparado por el grupo Friendly Fire Fixes.
//# Se incluyen ligeros ajustes, correcciones y utilidades cooperativas, tambien hace el juego mas casual para experto.
//# El enfoque se mantiene fiel al estilo original del juego.

//# =======================================================================================
//# [	FF-Classic ] -- English
//# =======================================================================================
//# Basic configuration without extreme modifications. A plain vanilla setup.
//# Prepared by the Friendly Fire Fixes group.
//# Includes light tweaks, fixes, and cooperative utilities, also makes the game a little more casual friendly in expert gamemode.
//# The focus remains faithful to the original style of the game.

//# =======================================================================================
//# [ Complementaries ]
//# =======================================================================================

exec FF_complementaries.cfg

//# =======================================================================================
//# [ Plugin Loading ]
//# =======================================================================================

//# Balance Tweaks in CO-OP
sm plugins load "disabled/optionaltweaks/l4d2_ammostack_rework.smx"
sm plugins load "disabled/optionaltweaks/l4d2_static_shotgun_spread"
sm plugins load "disabled/optionaltweaks/[Edited] biletheworld.smx"
sm plugins load "disabled/optionaltweaks/[L4D2] CI_DamageMod.smx"
sm plugins load "disabled/optionaltweaks/l4d2_fireworks.smx"
sm plugins load "disabled/optionaltweaks/l4d2_finale_fail_ending.smx"

//# Undefined Directory
sm plugins load "disabled/[FF] Map Sniper Swap.smx"

//# Coop Essentials
sm plugins load "disabled/Handlers+Informators/DropWeapon.smx"
sm plugins load "disabled/Handlers+Informators/[FF] Command Utilities.smx"
//sm plugins load "disabled/coopessentials/[HoE] Gear Transfer.smx"
sm plugins load "disabled/coopessentials/[HoE] Item Hint.smx"

//# =======================================================================================
//# [ General ]
//# =======================================================================================

sv_maxplayers 4

//# =======================================================================================
//# [ Common Infected ]
//# =======================================================================================

//# Yeah no thanks... vanilla expert is bullshit
//# Common infected with damage resistance is a cheap way to make "difficulty" but it isnt...
//# I'd prefer to make expert more casual, and leave the difficulty to HardMode.
sm_cvar z_non_head_damage_factor_expert 0.75

//# Damage If Survivor alive
sm_cvar z_throttle_hit_interval_easy 0.10
sm_cvar z_throttle_hit_interval_normal 0.33
sm_cvar z_throttle_hit_interval_hard 0.33
sm_cvar z_throttle_hit_interval_expert 0.33

//# CI Damage
sm_cvar nb_damage_enable 1
sm_cvar nb_damage_easy 1.0
sm_cvar nb_damage_normal 2.0
sm_cvar nb_damage_hard 5.0
sm_cvar nb_damage_expert 11.0
sm_cvar nb_damage_modifier 0.9

//# Confogl Hordes
sm_cvar z_mega_mob_size 50

sm_cvar z_mob_spawn_min_size 15
sm_cvar z_mob_spawn_max_size 15

sm_cvar z_mob_spawn_min_interval_easy	250
sm_cvar z_mob_spawn_min_interval_normal 250
sm_cvar z_mob_spawn_min_interval_hard 250
sm_cvar z_mob_spawn_min_interval_expert 250

sm_cvar z_mob_spawn_max_interval_easy	 250
sm_cvar z_mob_spawn_max_interval_normal	250
sm_cvar z_mob_spawn_max_interval_hard	 250
sm_cvar z_mob_spawn_max_interval_expert 250

//# =======================================================================================
//# [ Special Infected ]
//# =======================================================================================

sm_cvar vomitjar_duration_infected_pz 20
sm_cvar tongue_break_from_damage_amount 300

sm_cvar z_jockey_speed 275
sm_cvar z_jockey_health 250

//# =======================================================================================
//# 									 Weaponry CVARs 
//# =======================================================================================

exec "friendlyfire_weaponbalance/casual.cfg"
